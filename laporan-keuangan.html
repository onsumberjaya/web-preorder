<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Laporan Keuangan - Benih Preorder</title>
<link rel="stylesheet" href="css/style.css" />
<script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&window.matchMedia("(prefers-color-scheme: dark)").matches)){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}})();</script>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#16a34a" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Benih Preorder" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" />
<link rel="preconnect" href="https://unpkg.com" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="preconnect" href="https://cdnjs.cloudflare.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web@2.1.2" defer></script>
<script src="js/pwa-register.js?v=10" defer></script>
</head>
<body data-allowed-roles="owner,admin_kasir">
  <div id="mobile-topbar"></div>
  <div id="mobile-bottom-nav"></div>
  <div id="sidebar-overlay"></div>
  <div class="app-shell">
    <nav id="sidebar"></nav>
    <main class="content">
      <h1 class="page-title">Laporan Keuangan</h1>
      <p class="page-subtitle">Ringkasan &amp; grafik, Buku Kas, Laba Rugi, Piutang &amp; Hutang, dan Tren -- dihitung dari data pesanan &amp; pengeluaran. Laporan defaultnya 30 hari terakhir.</p>

      <div class="card" style="margin-bottom:16px;">
        <div class="grid grid-2">
          <div class="field">
            <label>Dari Tanggal</label>
            <input type="date" id="lk-dari" />
          </div>
          <div class="field">
            <label>Sampai Tanggal</label>
            <input type="date" id="lk-sampai" />
          </div>
        </div>
        <button class="btn-secondary" onclick="applyLkFilter()">Terapkan Filter</button>
      </div>

      <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center;">
        <button type="button" class="btn-secondary" id="lk-tab-ringkasan" onclick="switchLkTab('ringkasan')"><i class="ph-bold ph-chart-pie-slice"></i> Ringkasan</button>
        <button type="button" class="btn-secondary" id="lk-tab-kas" onclick="switchLkTab('kas')"><i class="ph-bold ph-wallet"></i> Buku Kas</button>
        <button type="button" class="btn-secondary" id="lk-tab-labarugi" onclick="switchLkTab('labarugi')"><i class="ph-bold ph-chart-line-up"></i> Laba Rugi</button>
        <button type="button" class="btn-secondary" id="lk-tab-piutang" onclick="switchLkTab('piutang')"><i class="ph-bold ph-hand-coins"></i> Piutang & Hutang</button>
        <button type="button" class="btn-secondary" id="lk-tab-tren" onclick="switchLkTab('tren')"><i class="ph-bold ph-chart-bar"></i> Tren & Analisis</button>
        <span style="margin-left:auto; display:flex; gap:8px;">
          <button type="button" class="btn-secondary btn-sm" onclick="exportLkExcel()"><i class="ph-bold ph-file-xls"></i> Excel</button>
          <button type="button" class="btn-secondary btn-sm" onclick="exportLkPdf()"><i class="ph-bold ph-file-pdf"></i> PDF</button>
        </span>
      </div>

      <div id="lk-content"><div class="loading-center"><div class="spinner"></div></div></div>
    </main>
  </div>

  <!-- Modal detail transaksi & catat bayar (dari tab Piutang & Hutang) -->
  <div class="modal-backdrop" id="lk-detail-modal" style="display:none;">
    <div class="modal-box" style="max-width:560px;">
      <div id="lk-detail-content"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js" defer></script>
  <script src="js/firebase-config.js?v=10" defer></script>
  <script src="js/utils.js?v=10" defer></script>
  <script src="js/nav.js?v=10" defer></script>
  <script src="js/auth-guard.js?v=10" defer></script>
  <script src="js/presence.js?v=10" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js" defer></script>
  <script src="js/laporan-keuangan.js?v=10" defer></script>
</body>
</html>
