<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profil Toko - Benih Preorder</title>
<link rel="stylesheet" href="css/style.css" />
<script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&window.matchMedia("(prefers-color-scheme: dark)").matches)){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}})();</script>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#16a34a" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Benih Preorder" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="js/pwa-register.js"></script>
</head>
<body data-owner-only="true">
  <div id="mobile-topbar"></div>
  <div id="sidebar-overlay"></div>
  <div class="app-shell">
    <nav id="sidebar"></nav>
    <main class="content" style="max-width:520px;">
      <h1 class="page-title">Profil Toko</h1>
      <p class="page-subtitle">Informasi ini akan tercetak di kop nota.</p>

      <div class="card">
        <form id="toko-form">
          <div class="field">
            <label>Nama Toko *</label>
            <input type="text" id="toko-nama" required disabled />
          </div>
          <div class="field">
            <label>Alamat</label>
            <textarea id="toko-alamat" rows="2" disabled></textarea>
          </div>
          <div class="field">
            <label>No. HP / Telepon</label>
            <input type="text" id="toko-nohp" disabled />
          </div>
          <div id="toko-alert"></div>
          <div style="display:flex; gap:8px;">
            <button type="button" class="btn-secondary" id="toko-edit-btn" onclick="enableTokoEdit()"><i class="ph ph-pencil-simple"></i> Edit</button>
            <button type="submit" class="btn-primary" id="toko-submit" style="display:none;">Simpan</button>
            <button type="button" class="btn-secondary" id="toko-cancel-btn" style="display:none;" onclick="cancelTokoEdit()">Batal</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/presence.js"></script>
  <script src="js/toko.js"></script>
</body>
</html>
