<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard - Benih Preorder</title>
<link rel="stylesheet" href="css/style.css" />
<script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&window.matchMedia("(prefers-color-scheme: dark)").matches)){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}})();</script>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#16a34a" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Benih Preorder" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="js/pwa-register.js"></script>
</head>
<body>
  <div id="mobile-topbar"></div>
  <div id="sidebar-overlay"></div>
  <div class="app-shell">
    <nav id="sidebar"></nav>
    <main class="content">
      <div class="page-header-row">
        <h1 class="page-title" style="margin:0;">Dashboard</h1>
        <div class="page-header-actions">
          <button type="button" class="btn-secondary btn-sm" id="dash-filter-toggle-btn" onclick="toggleDashFilterVisibility()">
            <i class="ph-bold ph-funnel"></i> Filter
          </button>
          <button class="btn-secondary btn-sm" id="dashboard-refresh-btn" onclick="refreshDashboard()"><i class="ph-bold ph-arrows-clockwise"></i> Muat Ulang</button>
        </div>
      </div>
      <p class="page-subtitle">Ringkasan performa penjualan preorder.</p>

      <div class="filter-box" id="dash-filter-toolbar" style="display:none;">
        <div class="toolbar">
          <select id="filter-periode">
            <option value="semua">Semua Waktu</option>
            <option value="harian">Hari Ini</option>
            <option value="mingguan">7 Hari Terakhir</option>
            <option value="bulanan">Bulan Ini</option>
            <option value="custom">Rentang Tanggal...</option>
          </select>
          <input type="date" id="filter-dari" style="display:none;" />
          <span id="dash-to-label" style="display:none;">s/d</span>
          <input type="date" id="filter-sampai" style="display:none;" />
          <select id="filter-gelombang-dash"><option value="">Semua Gelombang</option></select>
          <select id="filter-cabang-dash"><option value="">Semua Cabang</option></select>
        </div>
      </div>

      <div id="dashboard-content"><div class="loading-center"><div class="spinner"></div></div></div>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/presence.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
