<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cek Status Pesanan</title>
<link rel="stylesheet" href="css/style.css" />
<script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&window.matchMedia("(prefers-color-scheme: dark)").matches)){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}})();</script>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<meta name="theme-color" content="#16a34a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  body {
    background: var(--gray-50);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  .status-card {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border-radius: var(--radius-lg, 16px);
    box-shadow: var(--shadow-md, 0 4px 16px rgba(0,0,0,.08));
    padding: 24px;
    margin-top: 20px;
  }
  .status-card h1 {
    font-size: 17px;
    margin: 0 0 4px;
    text-align: center;
  }
  .status-sub {
    text-align: center;
    color: var(--gray-500);
    font-size: 13px;
    margin: 0 0 20px;
  }
  .status-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 0;
    border-bottom: 1px solid var(--gray-100);
    font-size: 13.5px;
  }
  .status-row:last-child { border-bottom: none; }
  .status-row span:first-child { color: var(--gray-500); }
  .status-row span:last-child { text-align: right; font-weight: 600; }
  .status-items { margin: 6px 0 10px; }
  .status-item-row {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    padding: 4px 0;
    border-bottom: 1px dashed var(--gray-100);
  }
  .otp-input {
    width: 100%;
    text-align: center;
    font-size: 22px;
    letter-spacing: 8px;
    padding: 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--gray-200);
    margin: 4px 0 12px;
  }
  .store-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 14px; }
  .store-logo { width: 68px; height: 68px; margin-bottom: 8px; }
  .store-logo svg { width: 100%; height: 100%; }
  .store-name { font-size: 13px; font-weight: 700; color: #222; }

  /* Kontras badge status dipertegas khusus di halaman ini (bukan diubah
     secara global di css/style.css) -- supaya badge kuning/merah lebih
     jelas dibaca sekilas lewat layar HP, tanpa mengubah tampilan badge yang
     sama di halaman admin lain. */
  #status-content .badge-yellow { border: 1px solid #fde68a; }
  #status-content .badge-red { border: 1px solid #fecaca; }

  .info-note {
    background: var(--brand-50); color: var(--brand-ink);
    border-radius: var(--radius-sm); padding: 10px 12px; font-size: 11px;
    margin: 12px 0 4px; line-height: 1.5;
  }
  .thanks-note { text-align: center; color: #999; font-size: 11px; margin: 10px 0 0; }
  .updated-at { text-align: center; color: #aaa; font-size: 10px; margin-top: 8px; }

  .wa-bar {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--gray-100);
  }
  .wa-bar a {
    display: flex; align-items: center; gap: 6px;
    background: #25D366; color: #fff; text-decoration: none;
    padding: 9px 16px; border-radius: 999px; font-size: 12.5px; font-weight: 700;
  }
</style>
</head>
<body>
  <div class="status-card">
    <div id="status-loading" style="text-align:center; padding:40px 0;">
      <div class="spinner"></div>
      <p style="color:var(--gray-500); font-size:13px; margin:20px 0 0;">Memuat status pesanan...</p>
    </div>
    <div id="status-content" style="display:none;"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js" defer></script>
  <script src="js/firebase-config.js?v=10" defer></script>
  <script src="js/utils.js?v=10" defer></script>
  <script src="js/status.js?v=10" defer></script>
</body>
</html>
