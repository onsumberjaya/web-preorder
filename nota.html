<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cetak Nota</title>
<link rel="stylesheet" href="css/style.css" />
<script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&window.matchMedia("(prefers-color-scheme: dark)").matches)){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}})();</script>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#16a34a" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Benih Preorder" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="js/pwa-register.js"></script>
</head>
<body>
  <div class="no-print" style="max-width:700px; margin:20px auto; padding:0 16px;">
    <div class="card">
      <h2 style="margin-top:0;">Cetak Nota</h2>
      <p style="color:var(--gray-500); font-size:14px;">Pilih format kertas, lalu klik Cetak.</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn-primary" onclick="doPrint('a4')">🖨️ Cetak A4</button>
        <button class="btn-primary" onclick="doPrint('dm')">🖨️ Cetak Dot Matrix 76mm</button>
        <button class="btn-secondary" onclick="window.close()">Tutup</button>
      </div>
    </div>
  </div>

  <div id="nota-container">
    <div class="loading-center no-print"><div class="spinner"></div></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/presence.js"></script>
  <script src="js/nota.js"></script>
</body>
</html>
