<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Daftar Pesanan - Benih Preorder</title>
<link rel="stylesheet" href="css/style.css" />
<script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||(!t&&window.matchMedia("(prefers-color-scheme: dark)").matches)){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}})();</script>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#16a34a" />
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Benih Preorder" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="js/pwa-register.js"></script>
</head>
<body>
  <div id="mobile-topbar"></div>
  <div id="sidebar-overlay"></div>
  <div class="app-shell">
    <nav id="sidebar"></nav>
    <main class="content">
      <div class="page-header-row">
        <h1 class="page-title" style="margin:0;">Daftar Pesanan</h1>
        <div class="page-header-actions">
          <button type="button" class="btn-secondary btn-sm" id="pesanan-filter-toggle-btn" onclick="togglePesananFilterVisibility()">
            <i class="ph-bold ph-funnel"></i> Filter
          </button>
          <button class="btn-secondary btn-sm" onclick="refreshOrders()"><i class="ph-bold ph-arrows-clockwise"></i> Muat Ulang</button>
        </div>
      </div>
      <p class="page-subtitle">Semua pesanan preorder. Gunakan filter untuk mempersempit pencarian.</p>

      <div class="quick-filter-row">
        <button type="button" class="quick-filter-chip" id="quick-chip-belum-diambil" onclick="applyQuickFilter('belum-diambil-minggu-ini')">
          <i class="ph-bold ph-calendar-check"></i> Belum Diambil Minggu Ini
        </button>
        <button type="button" class="quick-filter-chip" id="quick-chip-belum-lunas" onclick="applyQuickFilter('belum-lunas')">
          <i class="ph-bold ph-money"></i> Belum Lunas
        </button>
      </div>

      <div class="filter-box" id="pesanan-filter-toolbar" style="display:none;">
        <div class="toolbar">
          <label style="font-size:12.5px; color:var(--gray-500); display:flex; align-items:center; gap:6px;">
            Dari <input type="date" id="filter-dari" />
          </label>
          <label style="font-size:12.5px; color:var(--gray-500); display:flex; align-items:center; gap:6px;">
            Sampai <input type="date" id="filter-sampai" />
          </label>
          <input type="text" id="filter-search" placeholder="Cari nama / no HP / no pesanan" style="min-width:200px;" />
          <select id="filter-cabang" style="display:none;"><option value="">Semua Cabang</option></select>
          <select id="filter-produk"><option value="">Semua Produk</option></select>
          <select id="filter-gelombang"><option value="">Semua Gelombang</option></select>
          <select id="filter-bayar">
            <option value="">Semua Status Bayar</option>
            <option value="belum_lunas">Belum Lunas (Cicilan + Belum Bayar)</option>
            <option value="lunas">Lunas</option>
            <option value="cicilan">Bayar Sebagian</option>
            <option value="belum_bayar">Belum Bayar</option>
          </select>
          <select id="filter-ambil">
            <option value="">Semua Status Ambil</option>
            <option value="sudah">Sudah Diambil</option>
            <option value="belum">Belum Diambil</option>
          </select>
          <label class="filter-chip" id="anomali-chip">
            <input type="checkbox" id="filter-harga-janggal" /> ⚠️ Cek Anomali
          </label>
          <label style="font-size:12.5px; color:var(--gray-500); display:flex; align-items:center; gap:6px;">
            Tampilkan
            <select id="filter-pagesize" style="min-width:auto;">
              <option value="11" selected>11</option>
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
            / halaman
          </label>
          <button class="btn-secondary btn-sm" onclick="resetFilters()">Reset Filter</button>
        </div>
      </div>

      <div id="bulk-toolbar" class="card" style="display:none; margin-bottom:16px; background:var(--brand-50);">
        <div class="toolbar" style="margin:0;">
          <strong id="bulk-count">0 dipilih</strong>
          <button class="btn-secondary btn-sm" onclick="bulkAction(true)">Tandai Sudah Diambil</button>
          <button class="btn-secondary btn-sm" onclick="bulkAction(false)">Tandai Belum Diambil</button>
          <button class="btn-danger btn-sm" id="bulk-delete-btn" onclick="bulkDelete()" style="display:none;">Hapus</button>
        </div>
      </div>

      <div id="order-list"><div class="loading-center"><div class="spinner"></div></div></div>
    </main>
  </div>

  <!-- Modal Detail Pesanan + Riwayat Pembayaran -->
  <div class="modal-backdrop" id="detail-modal" style="display:none;">
    <div class="modal-box" style="max-width:560px;">
      <div id="detail-modal-content"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/presence.js"></script>
  <script src="js/pesanan.js"></script>
</body>
</html>
